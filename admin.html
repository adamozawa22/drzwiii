<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Dzwonki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c0f;
    --panel: #12161c;
    --panel2: #171c23;
    --line: #232933;
    --text: #e9edf2;
    --muted: #7a8492;
    --amber: #ffb100;
    --teal: #4fd1c5;
    --red: #ff4b3e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
  }
  .center{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px;
    width:100%;
    max-width:380px;
  }
  .card h1{
    font-size:22px;
    margin:0 0 24px;
  }
  input{
    width:100%;
    padding:12px 14px;
    margin-bottom:12px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
  }
  input:focus{ outline:2px solid var(--amber); border-color:transparent; }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-glowny{
    width:100%;
    padding:12px;
    background:var(--amber);
    color:#1a1200;
    font-weight:700;
    border-radius:10px;
    font-size:15px;
  }
  .btn-glowny:hover{ filter:brightness(1.05); }
  .blad-login{ color:var(--red); font-size:13px; margin-top:10px; min-height:16px; }

  /* --- panel po zalogowaniu --- */
  .app{ display:none; max-width:900px; margin:0 auto; padding:40px 20px 80px; }
  .app.widoczny{ display:block; }
  header.top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:28px;
  }
  header.top h1{ font-size:24px; font-weight:800; margin:0; }
  .wyloguj{
    background:transparent; color:var(--muted);
    font-size:14px; text-decoration:underline;
  }

  .sekcja{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
    margin-bottom:24px;
  }
  .sekcja h2{ font-size:15px; color:var(--muted); font-weight:700; margin:0 0 16px; }

  table{ width:100%; border-collapse:collapse; }
  th{
    text-align:left; font-size:12px; color:var(--muted);
    font-weight:700; padding:0 10px 10px;
  }
  td{ padding:8px 10px; border-top:1px solid var(--line); }
  tr td input{ margin:0; padding:8px 10px; font-size:14px; }
  select{
    background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font-family:inherit; font-size:14px;
  }
  .akcje{ display:flex; gap:8px; }
  .btn-mini{
    padding:8px 12px; border-radius:8px; font-size:13px; font-weight:600;
  }
  .btn-zapisz{ background:var(--teal); color:#04211d; }
  .btn-usun{ background:transparent; color:var(--red); border:1px solid var(--red); }
  .btn-dodaj{
    margin-top:16px;
    background:var(--panel2); color:var(--text);
    border:1px dashed var(--line);
    padding:12px; width:100%; border-radius:10px; font-weight:600;
  }
  .info{ font-size:13px; color:var(--muted); margin-top:10px; }
  .status{ font-size:13px; margin-top:12px; min-height:16px; }
  .status.ok{ color:var(--teal); }
  .status.blad{ color:var(--red); }

  a.link-tv{ color:var(--amber); }
</style>
</head>
<body>

<!-- EKRAN LOGOWANIA -->
<div id="ekran-login" class="center">
  <div class="card">
    <h1>Panel dzwonków</h1>
    <input id="login-email" type="email" placeholder="e-mail" autocomplete="username">
    <input id="login-haslo" type="password" placeholder="hasło" autocomplete="current-password">
    <button class="btn-glowny" onclick="zaloguj()">Zaloguj</button>
    <div id="login-blad" class="blad-login"></div>
  </div>
</div>

<!-- PANEL -->
<div id="app" class="app">
  <header class="top">
    <h1>Plan dzwonków</h1>
    <button class="wyloguj" onclick="wyloguj()">wyloguj</button>
  </header>

  <div class="sekcja">
    <h2>DZISIEJSZY PLAN (ten sam każdego dnia)</h2>
    <table>
      <thead>
        <tr>
          <th>Etykieta</th>
          <th>Typ</th>
          <th>Start</th>
          <th>Koniec</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabela-plan"></tbody>
    </table>
    <button class="btn-dodaj" onclick="dodajWiersz()">+ dodaj punkt planu</button>
    <div id="status" class="status"></div>
    <p class="info">Zmiany widać na TV od razu (na żywo). Podgląd: <a class="link-tv" href="index.html" target="_blank">index.html</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- UZUPEŁNIJ SWOIMI DANYMI Z SUPABASE (Project Settings -> API) ----
  const SUPABASE_URL = "https://cedmjyrqjcvabdmyjmzd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_tu9CPL3sPtKJaVqTiPDc4A_trd1nsJ6";
  // -----------------------------------------------------------------------

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const elLoginScreen = document.getElementById('ekran-login');
  const elApp = document.getElementById('app');
  const elLoginBlad = document.getElementById('login-blad');
  const elTabela = document.getElementById('tabela-plan');
  const elStatus = document.getElementById('status');

  let wiersze = []; // lokalna kopia planu z tabeli

  async function zaloguj(){
    elLoginBlad.textContent = '';
    const email = document.getElementById('login-email').value.trim();
    const haslo = document.getElementById('login-haslo').value;
    const { error } = await sb.auth.signInWithPassword({ email, password: haslo });
    if(error){
      elLoginBlad.textContent = 'Nieprawidłowy e-mail lub hasło.';
      return;
    }
    pokazApp();
  }

  async function wyloguj(){
    await sb.auth.signOut();
    location.reload();
  }

  async function pokazApp(){
    elLoginScreen.style.display = 'none';
    elApp.classList.add('widoczny');
    await wczytaj();
  }

  async function wczytaj(){
    const { data, error } = await sb
      .from('dzwonki')
      .select('*')
      .order('start_czas', { ascending: true })
      .order('kolejnosc', { ascending: true });

    if(error){
      pokazStatus('Błąd wczytywania: ' + error.message, true);
      return;
    }
    wiersze = data;
    renderTabela();
  }

  function renderTabela(){
    elTabela.innerHTML = '';
    wiersze.forEach(w => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input value="${w.etykieta}" data-pole="etykieta" data-id="${w.id}"></td>
        <td>
          <select data-pole="typ" data-id="${w.id}">
            <option value="lekcja" ${w.typ==='lekcja'?'selected':''}>lekcja</option>
            <option value="przerwa" ${w.typ==='przerwa'?'selected':''}>przerwa</option>
          </select>
        </td>
        <td><input type="time" value="${w.start_czas.slice(0,5)}" data-pole="start_czas" data-id="${w.id}"></td>
        <td><input type="time" value="${w.koniec_czas.slice(0,5)}" data-pole="koniec_czas" data-id="${w.id}"></td>
        <td class="akcje">
          <button class="btn-mini btn-zapisz" onclick="zapiszWiersz('${w.id}')">zapisz</button>
          <button class="btn-mini btn-usun" onclick="usunWiersz('${w.id}')">usuń</button>
        </td>
      `;
      elTabela.appendChild(tr);
    });
  }

  function pobierzWartosciWiersza(id){
    const pola = document.querySelectorAll(`[data-id="${id}"]`);
    const wynik = {};
    pola.forEach(p => wynik[p.dataset.pole] = p.value);
    return wynik;
  }

  async function zapiszWiersz(id){
    const dane = pobierzWartosciWiersza(id);
    if(!dane.etykieta || !dane.start_czas || !dane.koniec_czas){
      pokazStatus('Uzupełnij wszystkie pola.', true);
      return;
    }
    if(dane.start_czas >= dane.koniec_czas){
      pokazStatus('Godzina końca musi być późniejsza niż start.', true);
      return;
    }
    const { error } = await sb.from('dzwonki').update(dane).eq('id', id);
    if(error){
      pokazStatus('Błąd zapisu: ' + error.message, true);
      return;
    }
    pokazStatus('Zapisano.', false);
    await wczytaj();
  }

  async function usunWiersz(id){
    if(!confirm('Usunąć ten punkt planu?')) return;
    const { error } = await sb.from('dzwonki').delete().eq('id', id);
    if(error){
      pokazStatus('Błąd usuwania: ' + error.message, true);
      return;
    }
    await wczytaj();
  }

  async function dodajWiersz(){
    const nowy = {
      etykieta: 'Nowy punkt',
      typ: 'lekcja',
      start_czas: '08:00',
      koniec_czas: '08:45',
      kolejnosc: wiersze.length + 1
    };
    const { error } = await sb.from('dzwonki').insert(nowy);
    if(error){
      pokazStatus('Błąd dodawania: ' + error.message, true);
      return;
    }
    await wczytaj();
  }

  function pokazStatus(tekst, czyBlad){
    elStatus.textContent = tekst;
    elStatus.className = 'status ' + (czyBlad ? 'blad' : 'ok');
    setTimeout(() => { elStatus.textContent = ''; }, 3000);
  }

  // jeśli sesja już aktywna (np. odświeżenie strony), wejdź od razu do panelu
  sb.auth.getSession().then(({ data }) => {
    if(data.session) pokazApp();
  });
</script>
</body>
</html>
