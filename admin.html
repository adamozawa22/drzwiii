<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status drzwi</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #151515;
    color: white;
    transition:
        background 0.8s cubic-bezier(.22,1,.36,1),
        color 0.5s ease;
}

/* =========================
   GŁÓWNY EKRAN
========================= */

.screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    position: relative;

    transition:
        opacity 0.35s ease,
        transform 0.8s cubic-bezier(.22,1,.36,1),
        filter 0.5s ease;
}

/* =========================
   NORMALNY
========================= */

body.closed {
    background:
        radial-gradient(circle at center, #ff4545 0%, #d40000 55%, #850000 100%);
}

body.open {
    background:
        radial-gradient(circle at center, #35e879 0%, #08a947 55%, #006d2c 100%);
}

body.closed .main-icon {
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.25));
}

body.open .main-icon {
    filter: drop-shadow(0 10px 30px rgba(0,0,0,.2));
}

.main-icon {
    font-size: clamp(90px, 15vw, 190px);
    line-height: 1;
    margin-bottom: 25px;

    animation: iconAppear .7s cubic-bezier(.22,1,.36,1);
}

.status {
    font-size: clamp(50px, 9vw, 125px);
    font-weight: 900;
    letter-spacing: -4px;
    text-align: center;
    text-shadow: 0 8px 30px rgba(0,0,0,.2);

    animation: statusAppear .65s cubic-bezier(.22,1,.36,1);
}

.message {
    margin-top: 18px;
    font-size: clamp(18px, 3vw, 34px);
    font-weight: 600;
    opacity: .9;
    text-align: center;

    animation: messageAppear .7s ease;
}

/* =========================
   NAZWA TRYBU
========================= */

.mode-name {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);

    font-size: clamp(15px, 2vw, 23px);
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;

    opacity: .75;

    transition:
        opacity .4s ease,
        transform .5s ease;
}

.mode-name.animate {
    animation: modeChange .7s cubic-bezier(.22,1,.36,1);
}

/* =========================
   AWARIA
========================= */

body.malfunction {
    background:
        repeating-linear-gradient(
            0deg,
            #090909 0px,
            #090909 3px,
            #151515 4px,
            #151515 7px
        );

    animation: malfunctionBg 0.15s infinite;
}

body.malfunction .screen {
    filter: contrast(1.3);
}

body.malfunction .main-icon {
    animation:
        glitchIcon .2s infinite,
        iconAppear .7s cubic-bezier(.22,1,.36,1);
}

body.malfunction .status {
    text-shadow:
        4px 0 #ff0000,
        -4px 0 #00ffff,
        0 0 25px rgba(255,255,255,.3);

    animation:
        glitchText .18s infinite,
        statusAppear .65s cubic-bezier(.22,1,.36,1);
}

/* =========================
   AWARYJNY
========================= */

body.emergency {
    background:
        radial-gradient(
            circle at center,
            #ffe600 0%,
            #ff9d00 40%,
            #d90000 100%
        );
}

body.emergency .screen {
    animation: emergencyPulse 1.5s infinite;
}

body.emergency .status {
    text-shadow:
        0 0 20px rgba(255,255,255,.7),
        0 8px 30px rgba(0,0,0,.25);
}

body.emergency .mode-name {
    opacity: 1;
}

/* =========================
   EWAKUACJA
========================= */

body.evacuation {
    background:
        linear-gradient(
            135deg,
            #00a844,
            #00d96b,
            #007a34
        );

    background-size: 200% 200%;

    animation: evacuationBg 5s ease infinite;
}

body.evacuation .status {
    font-size: clamp(45px, 8vw, 110px);
    text-shadow: 0 8px 30px rgba(0,0,0,.25);
}

body.evacuation .main-icon {
    animation:
        evacuationIcon 1s infinite alternate,
        iconAppear .7s cubic-bezier(.22,1,.36,1);
}

/* =========================
   LOCKDOWN
========================= */

body.lockdown {
    background:
        radial-gradient(
            circle at center,
            #5d0000 0%,
            #240000 55%,
            #080000 100%
        );
}

body.lockdown .status {
    letter-spacing: 1px;
    text-transform: uppercase;

    text-shadow:
        0 0 15px rgba(255,0,0,.8),
        0 8px 35px rgba(0,0,0,.5);
}

body.lockdown .mode-name {
    opacity: 1;
    color: #ff5c5c;
}

/* =========================
   ANIMACJE ZMIANY
========================= */

.screen.transitioning {
    animation: screenTransition .75s cubic-bezier(.22,1,.36,1);
}

@keyframes screenTransition {
    0% {
        opacity: .25;
        transform: scale(.94);
        filter: blur(12px);
    }

    55% {
        opacity: 1;
        transform: scale(1.025);
        filter: blur(0);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes iconAppear {
    0% {
        opacity: 0;
        transform: scale(.55) translateY(25px);
    }

    100% {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes statusAppear {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes messageAppear {
    0% {
        opacity: 0;
        transform: translateY(15px);
    }

    100% {
        opacity: .9;
        transform: translateY(0);
    }
}

@keyframes modeChange {
    0% {
        opacity: 0;
        transform:
            translateX(-50%)
            translateY(12px);
    }

    100% {
        opacity: .75;
        transform:
            translateX(-50%)
            translateY(0);
    }
}

/* =========================
   SPECJALNE
========================= */

@keyframes emergencyPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.01);
    }
}

@keyframes evacuationBg {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes evacuationIcon {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-8px);
    }
}

@keyframes malfunctionBg {
    0% {
        transform: translate(0);
    }

    25% {
        transform: translate(1px, -1px);
    }

    50% {
        transform: translate(-1px, 1px);
    }

    75% {
        transform: translate(1px, 1px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes glitchIcon {
    0% {
        transform: translate(0);
    }

    25% {
        transform: translate(4px, -2px);
    }

    50% {
        transform: translate(-4px, 2px);
    }

    75% {
        transform: translate(2px, 3px);
    }

    100% {
        transform: translate(0);
    }
}

@keyframes glitchText {
    0% {
        transform: translate(0);
    }

    30% {
        transform: translate(-3px, 1px);
    }

    60% {
        transform: translate(3px, -1px);
    }

    100% {
        transform: translate(0);
    }
}

/* =========================
   KARTA
========================= */

.card-area {
    position: absolute;
    bottom: 90px;
}

.card-button {
    border: none;
    border-radius: 18px;

    padding: 18px 30px;

    background: rgba(255,255,255,.95);
    color: #111;

    font-size: 20px;
    font-weight: 800;

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.card-button:hover {
    transform: translateY(-3px);
    box-shadow:
        0 16px 40px rgba(0,0,0,.3);
}

.card-button:active {
    transform: scale(.96);
}

.hidden {
    display: none;
}

/* =========================
   ODŚWIEŻANIE
========================= */

.refreshing::after {
    content: "";

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 4px;

    background: rgba(255,255,255,.8);

    transform: translateX(-100%);

    animation: refreshLine .65s ease;
}

@keyframes refreshLine {
    from {
        transform: translateX(-100%);
    }

    to {
        transform: translateX(100%);
    }
}
</style>
</head>

<body class="closed">

<div class="screen" id="screen">

    <div class="main-icon" id="icon">
        🔒
    </div>

    <div class="status" id="status">
        ZAMKNIĘTE
    </div>

    <div class="message" id="message"></div>

    <div class="card-area hidden" id="cardArea">
        <button
            class="card-button"
            id="cardButton"
            onclick="przylozKarte()"
        >
            💳 PRZYŁÓŻ KARTĘ
        </button>
    </div>

    <div class="mode-name" id="modeName">
        NORMALNY
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://hktkcaskbjaungabrilw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KLUzRcddw5TfzHtodWpxTQ_NCPjqU0F";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const screen =
    document.getElementById("screen");

const status =
    document.getElementById("status");

const icon =
    document.getElementById("icon");

const message =
    document.getElementById("message");

const modeName =
    document.getElementById("modeName");

const cardArea =
    document.getElementById("cardArea");


let previousState = null;


/* =========================
   ODCZYT
========================= */

async function loadStatus() {

    /*
      Pasek animacji odświeżania.
      Nie zmieniamy całego ekranu przy
      każdym pollingu, bo wyglądałoby to
      jak migająca katastrofa.
    */

    document.body.classList.remove("refreshing");

    void document.body.offsetWidth;

    document.body.classList.add("refreshing");


    const { data, error } =
        await db
            .from("door_status")
            .select("*")
            .eq("id", 1)
            .single();


    if (error) {

        console.error(
            "Błąd Supabase:",
            error
        );

        return;
    }


    const newState = JSON.stringify(data);


    /*
      Animacja główna tylko wtedy,
      kiedy faktycznie coś się zmieniło.
    */

    if (previousState !== null &&
        previousState !== newState) {

        screen.classList.remove("transitioning");

        void screen.offsetWidth;

        screen.classList.add("transitioning");


        modeName.classList.remove("animate");

        void modeName.offsetWidth;

        modeName.classList.add("animate");
    }


    previousState = newState;


    updateScreen(data);
}


/* =========================
   AKTUALIZACJA EKRANU
========================= */

function updateScreen(data) {

    const mode =
        data.system_mode || "normal";


    document.body.classList.remove(
        "open",
        "closed",
        "emergency",
        "evacuation",
        "lockdown",
        "malfunction"
    );


    cardArea.classList.add("hidden");


    /* NORMALNY */

    if (mode === "normal") {

        if (data.is_open) {

            document.body.classList.add("open");

            icon.textContent = "🔓";

            status.textContent =
                "OTWARTE";

        } else {

            document.body.classList.add("closed");

            icon.textContent = "🔒";

            status.textContent =
                "ZAMKNIĘTE";
        }

        message.textContent =
            data.message || "";

        modeName.textContent =
            "NORMALNY";
    }


    /* AWARYJNY */

    else if (mode === "emergency") {

        document.body.classList.add(
            "emergency"
        );

        icon.textContent = "⚠️";

        status.textContent =
            data.is_open
                ? "OTWARTE"
                : "TRYB AWARYJNY";

        message.textContent =
            data.message ||
            "Postępuj zgodnie z komunikatami";

        modeName.textContent =
            "AWARYJNY";


        if (data.emergency_card_enabled) {

            cardArea.classList.remove(
                "hidden"
            );
        }
    }


    /* EWAKUACJA */

    else if (mode === "evacuation") {

        document.body.classList.add(
            "evacuation"
        );

        icon.textContent = "🚪";

        status.textContent =
            "EWAKUACJA";

        message.textContent =
            data.message ||
            "Opuść obiekt";

        modeName.textContent =
            "EWAKUACJA";
    }


    /* LOCKDOWN */

    else if (mode === "lockdown") {

        document.body.classList.add(
            "lockdown"
        );

        icon.textContent = "⛔";

        status.textContent =
            "LOCKDOWN";

        message.textContent =
            data.message ||
            "Dostęp zablokowany";

        modeName.textContent =
            "LOCKDOWN";
    }


    /* AWARIA */

    else if (mode === "malfunction") {

        document.body.classList.add(
            "malfunction"
        );

        icon.textContent = "⚠️";

        status.textContent =
            "AWARIA";

        message.textContent =
            data.message ||
            "System niedostępny";

        modeName.textContent =
            "AWARIA";
    }
}


/* =========================
   SYMULACJA KARTY
========================= */

function przylozKarte() {

    /*
      To jest wyłącznie animacja/UI.
      Nie steruje żadnym fizycznym zamkiem.
    */

    cardArea.classList.add(
        "hidden"
    );

    document.body.classList.remove(
        "emergency"
    );

    document.body.classList.add(
        "open"
    );

    icon.textContent =
        "🔓";

    status.textContent =
        "OTWARTE";

    message.textContent =
        "KARTA ZAAKCEPTOWANA";
}


/* =========================
   START
========================= */

loadStatus();


/*
  Odświeżanie danych co 2 sekundy.
*/

setInterval(
    loadStatus,
    2000
);

</script>

</body>
</html>
