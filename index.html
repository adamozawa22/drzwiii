<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dzwonki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c0f;
    --panel: #12161c;
    --line: #1f242c;
    --text: #e9edf2;
    --muted: #6b7480;
    --amber: #ffb100;
    --teal: #4fd1c5;
    --red: #ff4b3e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', sans-serif;
    overflow:hidden;
  }

  .topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    padding:24px 40px;
    font-family:'Space Mono', monospace;
    font-size:clamp(14px, 1.4vw, 20px);
    color:var(--muted);
    letter-spacing:0.03em;
    z-index:2;
  }
  .topbar span:last-child{ color:var(--text); }

  /* ---- belka przerwy (góra) ---- */
  .belka-przerwa{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 48px;
    background: linear-gradient(90deg, rgba(79,209,197,0.14), rgba(79,209,197,0.03));
    border-bottom:1px solid rgba(79,209,197,0.35);
    transform: translateY(-100%);
    opacity:0;
    z-index:5;
  }
  .belka-przerwa.widoczna{
    transform: translateY(0);
    opacity:1;
    transition: transform 0.7s cubic-bezier(.22,.85,.3,1), opacity 0.6s ease;
  }
  .belka-lewo{
    display:flex; align-items:center; gap:14px;
    font-size:clamp(16px, 1.9vw, 26px);
    font-weight:700;
  }
  .belka-kropka{
    width:12px; height:12px; border-radius:50%;
    background:var(--teal);
    animation: pulsuj 1.4s ease-in-out infinite;
  }
  @keyframes pulsuj{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }
  .belka-czas{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(30px, 4.4vw, 60px);
    color:var(--teal);
    font-variant-numeric: tabular-nums;
  }

  /* ---- normalny widok (lekcja / brak planu / koniec) ---- */
  .wrap{
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(16px, 3vh, 40px);
    padding:4vh 4vw;
    text-align:center;
    transition: opacity 0.5s ease;
  }
  .wrap.przerwa-aktywna{
    opacity:0;
    pointer-events:none;
  }

  .stan-pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:10px 24px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:clamp(14px, 1.6vw, 20px);
    font-weight:700;
    letter-spacing:0.04em;
  }
  .stan-pill .dot{
    width:10px; height:10px; border-radius:50%;
    background: var(--amber);
  }
  .stan-pill.koniec .dot{ background: var(--muted); }

  .etykieta{
    font-size:clamp(20px, 3vw, 40px);
    font-weight:800;
    color:var(--text);
  }

  .czas{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:clamp(80px, 16vw, 220px);
    line-height:1;
    letter-spacing:0.02em;
    color:var(--amber);
    font-variant-numeric: tabular-nums;
  }
  .czas.pilne{ color:var(--red); }
  .czas.koniec{ color:var(--muted); font-size:clamp(48px, 8vw, 100px); }

  .podpis{
    font-size:clamp(14px, 1.6vw, 22px);
    color:var(--muted);
    text-transform:lowercase;
  }

  .pasek-tor{
    width:min(700px, 80vw);
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .pasek-wypelnienie{
    height:100%;
    background:var(--amber);
    width:0%;
    transition:width 1s linear;
  }

  .nastepnie{
    font-size:clamp(14px, 1.4vw, 18px);
    color:var(--muted);
  }
  .nastepnie b{ color:var(--text); font-weight:700; }

  /* ---- sekcja artykułu (dół), sterowana ręcznie z admina, niezależna od lekcji/przerwy ---- */
  .sekcja-artykul{
    position:fixed;
    bottom:0; left:0; right:0;
    padding:5vh 8vw;
    display:none;
    flex-direction:column;
    gap:28px;
    z-index:4;
    background: linear-gradient(0deg, rgba(10,12,15,0.96) 45%, rgba(10,12,15,0));
  }
  .sekcja-artykul.widoczna{ display:flex; }

  .artykul-blok{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
  }
  .artykul-tytul{
    font-size:clamp(18px, 2.2vw, 28px);
    font-weight:800;
    color:var(--amber);
    opacity:0;
  }
  .artykul-tytul.widoczna{ animation: wjazdLinia 0.55s ease-out forwards; }

  .artykul-linie{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:900px;
  }
  .linia-artykulu{
    font-size:clamp(15px, 1.7vw, 21px);
    font-weight:600;
    color:var(--text);
    opacity:0;
  }
  .linia-artykulu.widoczna{ animation: wjazdLinia 0.55s ease-out forwards; }

  @keyframes wjazdLinia{
    from{ opacity:0; transform: translateY(24px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ---- alarm pożarowy: pełny ekran, nadpisuje wszystko ---- */
  .alarm-overlay{
    position:fixed; inset:0;
    z-index:999;
    background: radial-gradient(circle at 50% 10%, rgba(255,75,62,0.28), rgba(8,3,3,0.98) 62%);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6vh 8vw;
    gap:32px;
    box-shadow: inset 0 0 0 10px rgba(255,75,62,0.55);
  }
  .alarm-overlay.widoczny{
    display:flex;
    animation: obwodkaAlarmu 1.2s ease-in-out infinite;
  }
  @keyframes obwodkaAlarmu{
    0%,100%{ box-shadow: inset 0 0 0 10px rgba(255,75,62,0.55); }
    50%{ box-shadow: inset 0 0 0 10px rgba(255,75,62,0.15); }
  }
  .alarm-naglowek{
    font-size:clamp(34px, 6vw, 90px);
    font-weight:800;
    color:var(--red);
    letter-spacing:0.03em;
    animation: pulsuj 1s ease-in-out infinite;
  }
  .alarm-tytul{
    font-size:clamp(20px, 2.4vw, 30px);
    font-weight:700;
    color:#ffffff;
    opacity:0;
  }
  .alarm-tytul.widoczna{ animation: wjazdLinia 0.5s ease-out forwards; }
  .alarm-linie{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:900px;
  }
  .alarm-linia{
    font-size:clamp(19px, 2.3vw, 29px);
    font-weight:600;
    color:#ffffff;
    opacity:0;
  }
  .alarm-linia.widoczna{ animation: wjazdLinia 0.5s ease-out forwards; }

  .blad{
    position:fixed; bottom:16px; left:0; right:0;
    text-align:center;
    color:var(--red);
    font-family:'Space Mono', monospace;
    font-size:13px;
    z-index:1000;
  }
</style>
</head>
<body>

<div class="topbar">
  <span id="data"></span>
  <span id="zegar"></span>
</div>

<div id="belka-przerwa" class="belka-przerwa">
  <div class="belka-lewo">
    <span class="belka-kropka"></span>
    <span>Przerwa — powrót na lekcję za</span>
  </div>
  <div id="belka-czas" class="belka-czas">--:--</div>
</div>

<div id="wrap" class="wrap">
  <div id="pill" class="stan-pill">
    <span class="dot"></span>
    <span id="stan-tekst">Ładowanie…</span>
  </div>

  <div id="etykieta" class="etykieta"></div>

  <div id="czas" class="czas">--:--</div>
  <div id="podpis" class="podpis"></div>

  <div class="pasek-tor">
    <div id="pasek" class="pasek-wypelnienie"></div>
  </div>

  <div id="nastepnie" class="nastepnie"></div>
</div>

<div id="sekcja-artykul" class="sekcja-artykul"></div>

<div id="alarm-overlay" class="alarm-overlay">
  <div class="alarm-naglowek">⚠ ALARM POŻAROWY</div>
  <div id="alarm-tytul" class="alarm-tytul"></div>
  <div id="alarm-linie" class="alarm-linie"></div>
</div>

<div id="blad" class="blad"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://cedmjyrqjcvabdmyjmzd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_tu9CPL3sPtKJaVqTiPDc4A_trd1nsJ6";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let plan = [];
  let artykuly = [];
  let alarm = null;

  let stanPrzerwyAktywny = false;
  let ostatniKluczArtykulow = null;
  let alarmByloAktywne = false;

  const elZegar = document.getElementById('zegar');
  const elData = document.getElementById('data');
  const elPill = document.getElementById('pill');
  const elStanTekst = document.getElementById('stan-tekst');
  const elEtykieta = document.getElementById('etykieta');
  const elCzas = document.getElementById('czas');
  const elPodpis = document.getElementById('podpis');
  const elPasek = document.getElementById('pasek');
  const elNastepnie = document.getElementById('nastepnie');
  const elBlad = document.getElementById('blad');
  const elWrap = document.getElementById('wrap');
  const elBelka = document.getElementById('belka-przerwa');
  const elBelkaCzas = document.getElementById('belka-czas');
  const elSekcjaArtykul = document.getElementById('sekcja-artykul');
  const elAlarmOverlay = document.getElementById('alarm-overlay');
  const elAlarmTytul = document.getElementById('alarm-tytul');
  const elAlarmLinie = document.getElementById('alarm-linie');

  const DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];

  function toSekundy(t){
    const [h,m,s] = t.split(':').map(Number);
    return h*3600 + m*60 + (s||0);
  }

  function formatCzas(sek){
    sek = Math.max(0, Math.round(sek));
    const h = Math.floor(sek/3600);
    const m = Math.floor((sek%3600)/60);
    const s = sek%60;
    if(h > 0){
      return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    }
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  async function wczytajPlan(){
    const { data, error } = await sb
      .from('dzwonki')
      .select('*')
      .order('start_czas', { ascending: true })
      .order('kolejnosc', { ascending: true });
    if(error){ elBlad.textContent = 'Błąd wczytywania planu: ' + error.message; return; }
    elBlad.textContent = '';
    plan = data;
  }

  async function wczytajArtykuly(){
    const { data, error } = await sb
      .from('artykuly')
      .select('*')
      .order('kolejnosc', { ascending: true });
    if(error){ elBlad.textContent = 'Błąd wczytywania artykułów: ' + error.message; return; }
    artykuly = data || [];
  }

  async function wczytajAlarm(){
    const { data, error } = await sb
      .from('alarm_pozarowy')
      .select('*')
      .eq('id', 1)
      .single();
    if(error){ elBlad.textContent = 'Błąd wczytywania alarmu: ' + error.message; return; }
    alarm = data;
  }

  // ---------------- ARTYKUŁ (dół ekranu, ręcznie włączany w adminie) ----------------

  function aktualizujSekcjeArtykulow(){
    const aktywne = artykuly.filter(a => a.aktywny);
    const klucz = aktywne.map(a => a.id).join(',');

    if(klucz === ostatniKluczArtykulow){
      elSekcjaArtykul.classList.toggle('widoczna', aktywne.length > 0);
      return;
    }
    ostatniKluczArtykulow = klucz;
    elSekcjaArtykul.innerHTML = '';

    if(!aktywne.length){
      elSekcjaArtykul.classList.remove('widoczna');
      return;
    }
    elSekcjaArtykul.classList.add('widoczna');

    aktywne.forEach((art, idx) => {
      const blok = document.createElement('div');
      blok.className = 'artykul-blok';

      const tytulEl = document.createElement('div');
      tytulEl.className = 'artykul-tytul';
      tytulEl.textContent = art.tytul;
      blok.appendChild(tytulEl);

      const liniEl = document.createElement('div');
      liniEl.className = 'artykul-linie';
      const linie = (art.tresc || '').split('\n').map(l => l.trim()).filter(Boolean);
      const elementy = linie.map(tekst => {
        const d = document.createElement('div');
        d.className = 'linia-artykulu';
        d.textContent = tekst;
        liniEl.appendChild(d);
        return d;
      });
      blok.appendChild(liniEl);
      elSekcjaArtykul.appendChild(blok);

      setTimeout(() => tytulEl.classList.add('widoczna'), 100 + idx * 200);
      elementy.forEach((el, i) => {
        setTimeout(() => el.classList.add('widoczna'), 450 + idx * 200 + i * 400);
      });
    });
  }

  // ---------------- ALARM POŻAROWY (pełny ekran, ręcznie włączany w adminie) ----------------

  function pokazAlarm(){
    elAlarmOverlay.classList.add('widoczny');
    if(!alarmByloAktywne){
      alarmByloAktywne = true;
      elAlarmTytul.className = 'alarm-tytul';
      elAlarmTytul.textContent = alarm.tytul || 'Zasady postępowania';
      elAlarmLinie.innerHTML = '';
      const linie = (alarm.tresc || '').split('\n').map(l => l.trim()).filter(Boolean);
      const elementy = linie.map(tekst => {
        const d = document.createElement('div');
        d.className = 'alarm-linia';
        d.textContent = tekst;
        elAlarmLinie.appendChild(d);
        return d;
      });
      setTimeout(() => elAlarmTytul.classList.add('widoczna'), 150);
      elementy.forEach((el, i) => {
        setTimeout(() => el.classList.add('widoczna'), 600 + i * 450);
      });
    }
  }

  function ukryjAlarm(){
    alarmByloAktywne = false;
    elAlarmOverlay.classList.remove('widoczny');
  }

  // ---------------- ZEGAR / PLAN LEKCJI ----------------

  function wlaczPrzerwaUI(){
    if(stanPrzerwyAktywny) return;
    stanPrzerwyAktywny = true;
    elBelka.classList.add('widoczna');
    elWrap.classList.add('przerwa-aktywna');
  }

  function wylaczPrzerwaUI(){
    if(!stanPrzerwyAktywny) return;
    stanPrzerwyAktywny = false;
    elBelka.classList.remove('widoczna');
    elWrap.classList.remove('przerwa-aktywna');
  }

  function tick(){
    // alarm ma priorytet nad wszystkim
    if(alarm && alarm.aktywny){
      pokazAlarm();
      return;
    }
    ukryjAlarm();

    aktualizujSekcjeArtykulow();

    const teraz = new Date();
    const sekTeraz = teraz.getHours()*3600 + teraz.getMinutes()*60 + teraz.getSeconds();

    elZegar.textContent = teraz.toLocaleTimeString('pl-PL');
    elData.textContent = DNI[teraz.getDay()] + ', ' + teraz.toLocaleDateString('pl-PL');

    if(!plan.length){
      wylaczPrzerwaUI();
      renderBrakPlanu();
      return;
    }

    const aktualny = plan.find(p => {
      const s = toSekundy(p.start_czas), e = toSekundy(p.koniec_czas);
      return sekTeraz >= s && sekTeraz < e;
    });

    if(aktualny){
      const s = toSekundy(aktualny.start_czas), e = toSekundy(aktualny.koniec_czas);
      const pozostalo = e - sekTeraz;
      const postep = ((sekTeraz - s) / (e - s)) * 100;
      const jestPrzerwa = aktualny.typ === 'przerwa';

      if(jestPrzerwa){
        wlaczPrzerwaUI();
        elBelkaCzas.textContent = formatCzas(pozostalo);
      } else {
        wylaczPrzerwaUI();
        renderAktywny(aktualny, pozostalo, postep);
      }
      renderNastepny(sekTeraz);
      return;
    }

    wylaczPrzerwaUI();

    const przyszle = plan
      .map(p => ({...p, s: toSekundy(p.start_czas)}))
      .filter(p => p.s > sekTeraz)
      .sort((a,b) => a.s - b.s);

    if(przyszle.length){
      renderPrzerwaMiedzy(przyszle[0], przyszle[0].s - sekTeraz);
      elNastepnie.textContent = '';
    } else {
      renderKoniecZajec();
      elNastepnie.textContent = '';
    }
  }

  function renderAktywny(p, pozostalo, postep){
    elPill.className = 'stan-pill';
    elStanTekst.textContent = 'trwa lekcja';
    elEtykieta.textContent = p.etykieta;
    elCzas.className = 'czas' + (pozostalo <= 120 ? ' pilne' : '');
    elCzas.textContent = formatCzas(pozostalo);
    elPodpis.textContent = 'do końca lekcji';
    elPasek.style.width = Math.min(100, Math.max(0, postep)) + '%';
  }

  function renderPrzerwaMiedzy(nast, zaIle){
    elPill.className = 'stan-pill koniec';
    elStanTekst.textContent = 'przed zajęciami';
    elEtykieta.textContent = 'Zaraz zaczyna się: ' + nast.etykieta;
    elCzas.className = 'czas koniec';
    elCzas.textContent = formatCzas(zaIle);
    elPodpis.textContent = 'do rozpoczęcia';
    elPasek.style.width = '0%';
  }

  function renderKoniecZajec(){
    elPill.className = 'stan-pill koniec';
    elStanTekst.textContent = 'po zajęciach';
    elEtykieta.textContent = 'Koniec zajęć na dziś';
    elCzas.className = 'czas koniec';
    elCzas.textContent = '';
    elPodpis.textContent = '';
    elPasek.style.width = '0%';
  }

  function renderBrakPlanu(){
    elPill.className = 'stan-pill koniec';
    elStanTekst.textContent = 'brak planu';
    elEtykieta.textContent = 'Nie ustawiono planu dzwonków';
    elCzas.className = 'czas koniec';
    elCzas.textContent = '';
    elPodpis.textContent = 'ustaw plan w panelu admina';
    elPasek.style.width = '0%';
  }

  function renderNastepny(sekTeraz){
    const przyszle = plan
      .map(p => ({...p, s: toSekundy(p.start_czas)}))
      .filter(p => p.s > sekTeraz)
      .sort((a,b) => a.s - b.s);

    if(przyszle.length){
      const n = przyszle[0];
      elNastepnie.innerHTML = 'następnie: <b>' + n.etykieta + '</b> (' + n.start_czas.slice(0,5) + '–' + n.koniec_czas.slice(0,5) + ')';
    } else {
      elNastepnie.textContent = 'to ostatni punkt planu na dziś';
    }
  }

  // realtime: natychmiastowa reakcja na zmiany z admina
  sb.channel('dzwonki-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dzwonki' }, () => wczytajPlan())
    .subscribe();

  sb.channel('artykuly-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'artykuly' }, () => wczytajArtykuly())
    .subscribe();

  sb.channel('alarm-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'alarm_pozarowy' }, () => wczytajAlarm())
    .subscribe();

  wczytajPlan();
  wczytajArtykuly();
  wczytajAlarm();
  tick();
  setInterval(tick, 1000);
  // dodatkowe automatyczne odświeżanie danych co 10 sekund (niezależnie od realtime)
  setInterval(wczytajPlan, 10 * 1000);
  setInterval(wczytajArtykuly, 10 * 1000);
  setInterval(wczytajAlarm, 10 * 1000);
</script>
</body>
</html>
