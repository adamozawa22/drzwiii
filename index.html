<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status drzwi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 1000px;
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 40px;
}

.status {
    border-radius: 30px;
    padding: 60px 20px;
    transition: 0.3s;
}

.open {
    background: #166534;
}

.closed {
    background: #991b1b;
}

.icon {
    font-size: 120px;
    margin-bottom: 20px;
}

.status-text {
    font-size: 80px;
    font-weight: bold;
}

.info {
    margin-top: 30px;
    background: #1f2937;
    border-radius: 20px;
    padding: 25px;
}

.mode {
    font-size: 30px;
}

.message {
    font-size: 25px;
    margin-top: 15px;
}

.loading {
    margin-top: 20px;
    color: #9ca3af;
}

.spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid #777;
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (max-width: 600px) {

    h1 {
        font-size: 28px;
    }

    .status-text {
        font-size: 50px;
    }

    .icon {
        font-size: 80px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>STATUS DRZWI</h1>

    <div id="statusBox" class="status closed">

        <div id="icon" class="icon">
            🔴
        </div>

        <div id="statusText" class="status-text">
            ZAMKNIĘTE
        </div>

    </div>

    <div class="info">

        <div class="mode">
            TRYB:
            <strong id="mode">
                Normalny
            </strong>
        </div>

        <div id="message" class="message">
            Wkrótce zapraszamy
        </div>

    </div>

    <div class="loading">

        <span id="spinner" class="spinner"></span>

        <span id="connection">
            Sprawdzanie...
        </span>

    </div>

</div>

<script>

let poprzedniStan = null;

async function pobierzStatus() {

    const spinner = document.getElementById("spinner");
    const connection = document.getElementById("connection");

    spinner.style.display = "inline-block";

    try {

        /*
        TU BĘDZIE ADRES NASZEGO BACKENDU

        Na przykład:

        https://twoja-strona.pl/api/status
        */

        const response = await fetch("/api/status", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("Błąd serwera");
        }

        const data = await response.json();

        /*
        Sprawdzamy, czy stan rzeczywiście się zmienił.
        */

        const nowyStan = JSON.stringify(data);

        if (nowyStan !== poprzedniStan) {

            document.getElementById("statusText").textContent =
                data.isOpen ? "OTWARTE" : "ZAMKNIĘTE";

            document.getElementById("icon").textContent =
                data.isOpen ? "🟢" : "🔴";

            const box = document.getElementById("statusBox");

            box.classList.remove("open");
            box.classList.remove("closed");

            box.classList.add(
                data.isOpen ? "open" : "closed"
            );

            document.getElementById("mode").textContent =
                data.mode || "Normalny";

            document.getElementById("message").textContent =
                data.message || "";

            poprzedniStan = nowyStan;
        }

        connection.textContent =
            "Połączono • sprawdzono: " +
            new Date().toLocaleTimeString("pl-PL");

    } catch (error) {

        connection.textContent =
            "Brak połączenia • pokazuję ostatni stan";

    }

    spinner.style.display = "none";
}


/*
SPRAWDZAMY SERWER CO 5 SEKUND
*/

pobierzStatus();

setInterval(
    pobierzStatus,
    5000
);

</script>

</body>
</html>
