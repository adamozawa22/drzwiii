<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status drzwi</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    transition: background 0.7s ease;
}

/* NORMALNY - ZAMKNIĘTE */

body.closed {
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(255, 100, 100, .8),
            transparent 40%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(100, 0, 0, .9),
            transparent 50%
        ),
        linear-gradient(
            135deg,
            #ff1a1a,
            #790000
        );
}

/* NORMALNY - OTWARTE */

body.open {
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(120, 255, 150, .8),
            transparent 40%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(0, 100, 40, .9),
            transparent 50%
        ),
        linear-gradient(
            135deg,
            #00e65c,
            #007a32
        );
}

/* AWARYJNY */

body.emergency {
    background:
        radial-gradient(
            circle at 20% 20%,
            #7cff9b,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #00c853,
            #006b2c
        );
}

/* EWAKUACJA */

body.evacuation {
    background:
        repeating-linear-gradient(
            45deg,
            #00a83b,
            #00a83b 40px,
            #00852f 40px,
            #00852f 80px
        );
}

/* LOCKDOWN */

body.lockdown {
    background:
        radial-gradient(
            circle at center,
            #a00000,
            transparent 55%
        ),
        #3b0000;
}

/* AWARIA SYSTEMU */

body.malfunction {
    background: #050505;
}

/* GŁÓWNY EKRAN */

#status {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;

    padding: 30px;
}

.icon {
    font-size: clamp(90px, 18vw, 220px);
    line-height: 1;
}

.title {
    font-size: clamp(45px, 10vw, 140px);
    font-weight: 900;
    letter-spacing: 5px;

    text-shadow:
        0 10px 30px rgba(0,0,0,.3);
}

.message {
    font-size: clamp(18px, 3vw, 32px);
    font-weight: bold;
    max-width: 900px;
}

/* KARTA */

.card-area {
    position: fixed;

    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    width: min(90%, 500px);

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.3);

    backdrop-filter: blur(10px);
}

.card-button {
    width: 100%;

    padding: 20px;

    border: 2px solid rgba(255,255,255,.6);

    border-radius: 15px;

    background: rgba(255,255,255,.12);

    color: white;

    font-size: 22px;
    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.card-button:hover {
    background: rgba(255,255,255,.25);
}

.card-button:active {
    transform: scale(.97);
}

/* LOCKDOWN */

.lock-icon {
    font-size: clamp(80px, 16vw, 180px);
}

/* AWARIA */

body.malfunction .content {
    animation: shake .08s infinite;
}

body.malfunction .title {
    text-shadow:
        5px 0 red,
        -5px 0 cyan;
}

body.malfunction::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.04),
            rgba(255,255,255,.04) 2px,
            transparent 2px,
            transparent 5px
        );

    animation: scan .15s linear infinite;
}

body.malfunction::after {
    content: "SYSTEM ERROR";

    position: fixed;

    top: 15px;
    left: 15px;

    font-family: monospace;

    color: #ff3333;

    font-size: 14px;

    animation: blink .3s infinite;
}

@keyframes shake {

    0% {
        transform: translate(0,0);
    }

    25% {
        transform: translate(3px,-2px);
    }

    50% {
        transform: translate(-3px,2px);
    }

    75% {
        transform: translate(2px,3px);
    }

    100% {
        transform: translate(0,0);
    }
}

@keyframes scan {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(5px);
    }
}

@keyframes blink {

    50% {
        opacity: 0;
    }
}

.hidden {
    display: none !important;
}

</style>
</head>

<body class="closed">

<div id="status">

    <div class="content">

        <div
            id="icon"
            class="icon">
            🔴
        </div>

        <div
            id="title"
            class="title">
            ZAMKNIĘTE
        </div>

        <div
            id="message"
            class="message">
        </div>

    </div>

</div>


<!-- KARTA AWARYJNA -->

<div
    id="cardArea"
    class="card-area hidden">

    <button
        id="cardButton"
        class="card-button"
        onclick="przylozKarte()">

        💳 PRZYŁÓŻ KARTĘ

    </button>

</div>


<script>

const SUPABASE_URL =
    "https://hktkcaskbjaungabrilw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KLUzRcddw5TfzHtodWpxTQ_NCPjqU0F";


let ostatniStatus = null;

let kartaOdblokowana = false;


/* =========================
   POBIERANIE
========================= */

async function pobierzStatus() {

    try {

        const response = await fetch(

            SUPABASE_URL +
            "/rest/v1/door_status" +
            "?id=eq.1" +
            "&select=*",

            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY
                },

                cache: "no-store"
            }
        );


        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        if (!data.length) {
            throw new Error(
                "Brak rekordu"
            );
        }


        const status = data[0];


        ostatniStatus = status;


        aktualizujEkran(status);


    } catch (error) {

        console.error(error);

    }

}


/* =========================
   AKTUALIZACJA EKRANU
========================= */

function aktualizujEkran(status) {

    const mode =
        status.system_mode || "normal";


    document.body.className = "";


    const cardArea =
        document.getElementById(
            "cardArea"
        );


    cardArea.classList.add(
        "hidden"
    );


    /* NORMALNY */

    if (mode === "normal") {

        document.body.classList.add(
            status.is_open
                ? "open"
                : "closed"
        );


        document.getElementById(
            "icon"
        ).textContent =
            status.is_open
                ? "🟢"
                : "🔴";


        document.getElementById(
            "title"
        ).textContent =
            status.is_open
                ? "OTWARTE"
                : "ZAMKNIĘTE";


        document.getElementById(
            "message"
        ).textContent =
            status.message || "";


        return;
    }


    /* AWARYJNY */

    if (mode === "emergency") {

        document.body.classList.add(
            "emergency"
        );


        document.getElementById(
            "icon"
        ).textContent =
            "⚠️";


        document.getElementById(
            "title"
        ).textContent =
            "TRYB AWARYJNY";


        document.getElementById(
            "message"
        ).textContent =
            status.message ||
            "Przygotuj kartę dostępu";


        if (
            status.emergency_card_enabled
        ) {

            cardArea.classList.remove(
                "hidden"
            );

        }


        return;
    }


    /* EWAKUACJA */

    if (mode === "evacuation") {

        document.body.classList.add(
            "evacuation"
        );


        document.getElementById(
            "icon"
        ).textContent =
            "🚪";


        document.getElementById(
            "title"
        ).textContent =
            "EWAKUACJA";


        document.getElementById(
            "message"
        ).textContent =
            status.message ||
            "DRZWI ODBLOKOWANE";


        return;
    }


    /* LOCKDOWN */

    if (mode === "lockdown") {

        document.body.classList.add(
            "lockdown"
        );


        document.getElementById(
            "icon"
        ).textContent =
            "🔒";


        document.getElementById(
            "title"
        ).textContent =
            "LOCKDOWN";


        document.getElementById(
            "message"
        ).textContent =
            status.message ||
            "DOSTĘP ZABLOKOWANY";


        return;
    }


    /* AWARIA */

    if (mode === "malfunction") {

        document.body.classList.add(
            "malfunction"
        );


        document.getElementById(
            "icon"
        ).textContent =
            "⚠️";


        document.getElementById(
            "title"
        ).textContent =
            "SYSTEM ERROR";


        document.getElementById(
            "message"
        ).textContent =
            "SYSTEM UNAVAILABLE";


        return;
    }

}


/* =========================
   KARTA
========================= */

function przylozKarte() {

    if (
        !ostatniStatus ||
        !ostatniStatus.emergency_card_enabled
    ) {
        return;
    }


    kartaOdblokowana = true;


    document.getElementById(
        "icon"
    ).textContent =
        "🟢";


    document.getElementById(
        "title"
    ).textContent =
        "OTWARTE";


    document.getElementById(
        "message"
    ).textContent =
        "KARTA ZAAKCEPTOWANA";


    document.body.className =
        "open";


    document.getElementById(
        "cardArea"
    ).classList.add(
        "hidden"
    );

}


/* =========================
   START
========================= */

pobierzStatus();


setInterval(
    pobierzStatus,
    2000
);

</script>

</body>
</html>
