<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Status</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
    transition: background 0.8s ease;
}

body.closed {
    background:
        radial-gradient(circle at top left, #ff4b4b 0%, transparent 45%),
        radial-gradient(circle at bottom right, #650000 0%, transparent 55%),
        linear-gradient(135deg, #ff0000, #7a0000);
}

body.open {
    background:
        radial-gradient(circle at top left, #6cff8a 0%, transparent 45%),
        radial-gradient(circle at bottom right, #006b2c 0%, transparent 55%),
        linear-gradient(135deg, #00c853, #006b27);
}

#status {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.status-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}

.icon {
    font-size: clamp(100px, 20vw, 220px);
    line-height: 1;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.25));
}

.status-text {
    font-size: clamp(55px, 11vw, 150px);
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.mode {
    font-size: 20px;
    opacity: 0.8;
}

.hidden {
    display: none;
}

#error {
    position: fixed;
    bottom: 15px;
    left: 15px;
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body class="closed">

<div id="status">

    <div class="status-content">

        <div id="icon" class="icon">
            🔴
        </div>

        <div id="statusText" class="status-text">
            ZAMKNIĘTE
        </div>

        <div id="mode" class="mode">
            Normalny
        </div>

    </div>

</div>

<div id="error"></div>

<script>

const SUPABASE_URL =
    "https://hktkcaskbjaungabrilw.supabase.co";

const SUPABASE_KEY =
    "TWOJ_ANON_KEY";


let poprzedniStan = null;


async function pobierzStatus() {

    try {

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/door_status?id=eq.1&select=is_open,mode,message,updated_at",
            {
                method: "GET",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                },

                cache: "no-store"
            }
        );


        if (!response.ok) {
            throw new Error("Błąd Supabase");
        }


        const data = await response.json();


        if (!data.length) {
            throw new Error("Brak statusu");
        }


        const status = data[0];


        const stan =
            JSON.stringify(status);


        if (stan === poprzedniStan) {
            return;
        }


        poprzedniStan = stan;


        const otwarte =
            status.is_open === true;


        document.body.className =
            otwarte ? "open" : "closed";


        document.getElementById("icon").textContent =
            otwarte ? "🟢" : "🔴";


        document.getElementById("statusText").textContent =
            otwarte ? "OTWARTE" : "ZAMKNIĘTE";


        document.getElementById("mode").textContent =
            status.mode || "Normalny";


        document.getElementById("error").textContent = "";

    }

    catch (error) {

        document.getElementById("error").textContent =
            "Brak połączenia z serwerem";

    }

}


pobierzStatus();

setInterval(
    pobierzStatus,
    2000
);

</script>

</body>
</html>
